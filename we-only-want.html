<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>We Only Want…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <link rel="stylesheet" href="style.css">
</head>

<body class="wow-page">

<div class="wow-container">
  <div class="wow-background"></div>
  
  <div class="wow-reveal-wrapper">
    <div class="wow-reveal-image"></div>
  </div>

  <div class="wow-overlay"></div>

  <div class="wow-title">
    <h2>we only want</h2>
  </div>

  <div class="wow-prompt-container">
    <div class="wow-prompt">
      <div class="wow-input-wrapper">
        <input 
          type="text" 
          class="wow-input" 
          id="passwordInput" 
          placeholder=""
          autocomplete="off"
        />
      </div>
    </div>

  </div>



</div>

<script>
  const container = document.querySelector('.wow-container');
  const revealImage = document.querySelector('.wow-reveal-image');
  const wowTitle = document.querySelector('.wow-title');
  const wowPromptContainer = document.querySelector('.wow-prompt-container');
  const overlay = document.querySelector('.wow-overlay');
  const passwordInput = document.getElementById('passwordInput');
  const wowWrapper = document.querySelector('.wow-reveal-wrapper');
  
  let message = document.createElement('div');
  message.className = 'wow-message';
  message.id = 'message';
  passwordInput.parentElement.parentElement.appendChild(message);

  let isUnlocked = false;

  const cursorStyle = document.createElement('style');
  cursorStyle.textContent = `
    .wow-input:focus { animation: cursorBlink 1s infinite; }
    @keyframes cursorBlink {
      0%, 49% { caret-color: #101719; }
      50%, 100% { caret-color: transparent; }
    }
  `;
  document.head.appendChild(cursorStyle);

  function handleScroll() {
    const scrolled = window.scrollY;
    const maxScrollable = document.documentElement.scrollHeight - window.innerHeight;
    const scrollPercent = scrolled / maxScrollable;

    const maxScroll = maxScrollable * 0.25;
    if (scrolled > maxScroll && !isUnlocked) {
      window.scrollTo(0, maxScroll);
      return;
    }

    const revealPercent = Math.min(scrollPercent * 2, 1);
    revealImage.style.clipPath = `inset(${100 - (revealPercent * 100)}% 0 0 0)`;

    // post 60% scroll zooming and fading out
    if (revealPercent > 0.6) {
      const t = (revealPercent - 0.6) / 0.4; // 0 to 1 over the last 40%
      const scale = 1 + Math.pow(t, 2) * 3; // zoom up to 115%
      const opacity = 1 - t;
      revealImage.style.transform = `scale(${scale})`;
      revealImage.style.opacity = opacity;
      document.querySelector('.wow-background').style.transform = `scale(${scale})`;
      overlay.style.transition = 'background 2s ease-out';
      overlay.style.background = `rgba(0, 0, 0, 1)`;
      document.querySelector('.wow-title').style.opacity = 0;
      document.querySelector('.passwordInput').style.opacity = opacity;
    } else {
      revealImage.style.transform = 'scale(1)';
      revealImage.style.opacity = '1';
      document.querySelector('.wow-background').style.transform = 'scale(1)';
      overlay.style.background = 'rgba(0, 0, 0, 0)';
    }

    if (scrollPercent >= 0.2 ) {
      wowTitle.classList.add('visible');
      wowPromptContainer.classList.add('visible');
    } else {
      wowTitle.classList.remove('visible');
      wowPromptContainer.classList.remove('visible');
    }
  }

  // Initial fade in of the overlay
  setTimeout(() => {
    overlay.style.transition = 'background 8s ease-out';
    overlay.style.background = 'rgba(0, 0, 0, 0)';
  }, 1000);

  // Password check logic
  let hadWrongPassword = false;

  function checkPassword() {
    const answer = passwordInput.value.toLowerCase().trim();

    if (answer === 'the earth') {
      isUnlocked = true;
      wowWrapper.classList.add('wow-revealed');
      passwordInput.classList.add('success');
      passwordInput.disabled = true;

      // Only fade out the wrong password message if one was shown
      if (hadWrongPassword) {
        message.style.transition = 'opacity 1s ease-out';
        message.style.opacity = '0';
      }

      const scrollTo = document.documentElement.scrollHeight - window.innerHeight;
      const startY = window.scrollY;
      const distance = scrollTo - startY;
      const duration = 4000;
      const startTime = Date.now();

      function animateScroll() {
        const elapsed = Date.now() - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeProgress = progress < 0.5
          ? 2 * progress * progress
          : -1 + (4 - 2 * progress) * progress;

        window.scrollTo(0, startY + distance * easeProgress);

        // Only redirect after the scroll animation completes
        if (progress < 0.68) {
          requestAnimationFrame(animateScroll);
        } else {
          window.location.href = 'we-only-want-original-sin.html';
        }
      }

      animateScroll();

    } else {
      hadWrongPassword = true;
      message.style.transition = 'none';
      message.style.opacity = '1';
      message.textContent = 'Wrong password...';
      passwordInput.value = '';
      passwordInput.focus();
    }
  }
  
  passwordInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') checkPassword();
  });

  window.addEventListener('scroll', handleScroll);

  let promptVisible = false;

  document.addEventListener('touchend', () => {
    if (wowPromptContainer.classList.contains('visible') && !isUnlocked) {
      if (!promptVisible) {
        promptVisible = true;
        setTimeout(() => {
          if (!document.getElementById('tap-hint')) {
            const hint = document.createElement('div');
            hint.id = 'tap-hint';
            hint.textContent = 'tap to type';
            hint.style.cssText = `
              position: fixed; bottom: 30%; left: 50%;
              transform: translateX(-50%);
              color: #e4e2dc; font-family: monospace;
              font-size: 0.8rem; opacity: 0.5;
              z-index: 10; pointer-events: none;
            `;
            document.body.appendChild(hint);
          }
        }, 2000);
      } else {
        passwordInput.focus();
        const hint = document.getElementById('tap-hint');
        if (hint) hint.remove();
      }
    }
  });
</script>
</body>
</html>
