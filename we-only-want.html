<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>We Only Want…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <link rel="stylesheet" href="style.css">
</head>

<body class="page">

<div class="container">
  <div class="background"></div>
  
  <div class="reveal-wrapper">
    <div class="reveal-image"></div>
  </div>

  <div class="overlay"></div>

  <div class="title">
    <h2>we only want</h2>
  </div>

  <div class="prompt-container">
    <div class="prompt">
      <div class="input-wrapper">
        <input 
          type="text" 
          class="input" 
          id="passwordInput" 
          placeholder="enter password"
          autocomplete="off"
        />
      </div>
    </div>

  </div>



</div>

<script>
  const container = document.querySelector('.container');
  const revealImage = document.querySelector('.reveal-image');
  const wowTitle = document.querySelector('.title');
  const wowPromptContainer = document.querySelector('.prompt-container');
  const overlay = document.querySelector('.overlay');
  const passwordInput = document.getElementById('passwordInput');
  const wowWrapper = document.querySelector('.reveal-wrapper');

  // Scroll hint
  let scrollHintTimer;
  const scrollHint = document.createElement('div');
  scrollHint.id = 'scroll-hint';
  scrollHint.textContent = 'scroll';
  scrollHint.style.cssText = `
    position: fixed;
    top: calc(50% + 2rem);
    left: 50%;
    transform: translateX(-50%);
    color: #e4e2dc;
    font-family: monospace;
    font-size: 0.8rem;
    opacity: 0;
    transition: opacity 2s ease-in-out;
    z-index: 10;
    pointer-events: none;
  `;
  document.body.appendChild(scrollHint);

  // Show after 10 seconds with no scrolling
  scrollHintTimer = setTimeout(() => {
    scrollHint.style.opacity = '0.5';
  }, 5000);

  // Fade out on first scroll
  let hintDismissed = false;
  window.addEventListener('scroll', () => {
    if (!hintDismissed && window.scrollY > 0) {
      hintDismissed = true;
      clearTimeout(scrollHintTimer);
      scrollHint.style.transition = 'opacity 5s ease-out';
      scrollHint.style.opacity = '0';
    }
  }, { once: false });

  // Create message element for wrong password feedback
  
  let message = document.createElement('div');
  message.className = 'message';
  message.id = 'message';
  passwordInput.parentElement.parentElement.appendChild(message);

  let isUnlocked = false;

  // const cursorStyle = document.createElement('style');
  // cursorStyle.textContent = `
  //   .input:focus { animation: cursorBlink 1s infinite; }
  //   @keyframes cursorBlink {
  //     0%, 49% { caret-color: #101719; }
  //     50%, 100% { caret-color: transparent; }
  //   }
  // `;
  // document.head.appendChild(cursorStyle);

  function handleScroll() {
    const scrolled = window.scrollY;
    const maxScrollable = document.documentElement.scrollHeight - window.innerHeight;
    const scrollPercent = scrolled / maxScrollable;

    const maxScroll = maxScrollable * 0.25;
    if (scrolled > maxScroll && !isUnlocked) {
      window.scrollTo(0, maxScroll);
      return;
    }

    const revealPercent = Math.min(scrollPercent * 2, 1);
    revealImage.style.clipPath = `inset(${100 - (revealPercent * 100)}% 0 0 0)`;

    // post 60% scroll zooming and fading out
    if (revealPercent > 0.6) {
      const t = (revealPercent - 0.6) / 0.4; // 0 to 1 over the last 40%
      const scale = 1 + Math.pow(t, 2) * 3; // zoom up to 115%
      const opacity = 1 - t;
      revealImage.style.transform = `scale(${scale})`;
      revealImage.style.opacity = opacity;
      document.querySelector('.background').style.transform = `scale(${scale})`;
      overlay.style.transition = 'background 2s ease-out';
      overlay.style.background = `rgba(0, 0, 0, 1)`;
      document.querySelector('.title').style.opacity = 0;
      document.querySelector('.passwordInput').style.opacity = opacity;
    } else {
      revealImage.style.transform = 'scale(1)';
      revealImage.style.opacity = '1';
      document.querySelector('.background').style.transform = 'scale(1)';
      // overlay.style.background = 'rgba(0, 0, 0, 0)';
    }

    if (scrollPercent >= 0.24 ) {
      wowTitle.classList.add('visible');
      wowPromptContainer.classList.add('visible');
    } else {
      wowTitle.classList.remove('visible');
      wowPromptContainer.classList.remove('visible');
    }
  }

  // Initial fade in of the overlay
  setTimeout(() => {
    overlay.style.transition = 'background 8s ease-out';
    overlay.style.background = 'rgba(0, 0, 0, 0)';
  }, 1000);

  // Password check logic
  let hadWrongPassword = false;
  let wrongCount = 0; // ← add this

  function checkPassword() {
    const answer = passwordInput.value.toLowerCase().trim();

    if (answer === 'the earth') {
      isUnlocked = true;
      wowWrapper.classList.add('wow-revealed');
      passwordInput.classList.add('success');
      passwordInput.disabled = true;

      if (hadWrongPassword) {
        message.style.transition = 'opacity 1s ease-out';
        message.style.opacity = '0';
      }

      const scrollTo = document.documentElement.scrollHeight - window.innerHeight;
      const startY = window.scrollY;
      const distance = scrollTo - startY;
      const duration = 4000;
      const startTime = Date.now();

      function animateScroll() {
        const elapsed = Date.now() - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeProgress = progress < 0.5
          ? 2 * progress * progress
          : -1 + (4 - 2 * progress) * progress;

        window.scrollTo(0, startY + distance * easeProgress);

        if (progress < 1) {
          requestAnimationFrame(animateScroll);
        } else {
          setTimeout(() => {
            window.location.href = 'we-only-want-original-sin.html';
          }, 500);
        }
      }

      animateScroll();

    } else {
      hadWrongPassword = true;
      wrongCount++; // ← increment

      message.style.transition = 'none';
      message.style.opacity = '1';

      if (wrongCount >= 3) {
        message.innerHTML = 'Read James Connolly'; // ← second line
      } else {
        message.textContent = 'Wrong password...';
      }

      passwordInput.value = '';
    }
  }
  
  passwordInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') checkPassword();
  });

  window.addEventListener('scroll', handleScroll);
  handleScroll();

  // Auto-focus exactly once when prompt becomes visible
  let hasFocused = false;
  const focusObserver = new MutationObserver(() => {
    if (wowPromptContainer.classList.contains('visible') && !hasFocused && !isUnlocked) {
      hasFocused = true;
      passwordInput.focus();
    }
  });
  focusObserver.observe(wowPromptContainer, { attributes: true, attributeFilter: ['class'] });

  // let promptVisible = false;

  // document.addEventListener('touchend', () => {
  //   if (wowPromptContainer.classList.contains('visible') && !isUnlocked) {
  //     if (!promptVisible) {
  //       promptVisible = true;
  //       setTimeout(() => {
  //         if (!document.getElementById('tap-hint')) {
  //           const hint = document.createElement('div');
  //           hint.id = 'tap-hint';
  //           hint.textContent = 'tap to type';
  //           hint.style.cssText = `
  //             position: fixed; bottom: 30%; left: 50%;
  //             transform: translateX(-50%);
  //             color: #e4e2dc; font-family: monospace;
  //             font-size: 0.8rem; opacity: 0.5;
  //             z-index: 10; pointer-events: none;
  //           `;
  //           document.body.appendChild(hint);
  //         }
  //       }, 2000);
  //     } else {
  //       passwordInput.focus();
  //       const hint = document.getElementById('tap-hint');
  //       if (hint) hint.remove();
  //     }
  //   }
  // });
</script>
