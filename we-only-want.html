<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>We Only Want…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css">
</head>

<body class="wow-page">

<div class="wow-container">
  <div class="wow-background"></div>
  
  <div class="wow-reveal-wrapper">
    <div class="wow-reveal-image"></div>
  </div>

  <div class="wow-overlay"></div>

  <div class="wow-title">
    <h2>we only want</h2>
  </div>

  <div class="wow-prompt-container">
    <div class="wow-prompt">
      <div class="wow-input-wrapper">
        <input 
          type="text" 
          class="wow-input" 
          id="passwordInput" 
          placeholder=""
          autocomplete="off"
        />
        <!-- <button class="wow-button" id="submitBtn">Submit</button> -->
      </div>
      <!-- <div class="wow-message" id="message"></div> -->
    </div>
    
    <!-- first player -->
    <!-- <iframe style="border: 0; width: 100%; height: 42px;" src="https://bandcamp.com/EmbeddedPlayer/album=3138980524/size=small/bgcol=333333/linkcol=0f91ff/track=4054964082/transparent=true/" seamless><a href="https://jimbojonesdub.bandcamp.com/album/the-heat-death-of-my-hometown">The Heat Death of My Hometown by Jimbo Jones</a></iframe> -->

  </div>



</div>

<script>
  const container = document.querySelector('.wow-container');
  const revealImage = document.querySelector('.wow-reveal-image');
  const wowTitle = document.querySelector('.wow-title');
  const wowPromptContainer = document.querySelector('.wow-prompt-container');
  const overlay = document.querySelector('.wow-overlay');
  const passwordInput = document.getElementById('passwordInput');
  const submitBtn = document.getElementById('submitBtn');
  const wowWrapper = document.querySelector('.wow-reveal-wrapper');
  
  // Message display element
  let message = document.createElement('div');
  message.className = 'wow-message';
  message.id = 'message';
  passwordInput.parentElement.parentElement.appendChild(message);

  let isUnlocked = false;

  // Blinking cursor effect
  const cursorStyle = document.createElement('style');
  cursorStyle.textContent = `
    .wow-input:focus {
      animation: cursorBlink 1s infinite;
    }
    
    @keyframes cursorBlink {
      0%, 49% {
        caret-color: #101719;
      }
      50%, 100% {
        caret-color: transparent;
      }
    }
  `;
  document.head.appendChild(cursorStyle);

  function handleScroll() {
    const scrolled = window.scrollY;
    const containerHeight = container.clientHeight;
    const scrollPercent = scrolled / containerHeight;

    // Lock scroll at 50% until password is correct
    const maxScroll = (containerHeight * 0.5);
    if (scrolled > maxScroll && !isUnlocked) {
      window.scrollTo(0, maxScroll);
      return;
    }

    // Reveal image from bottom up - stops at 50% scroll
    const revealPercent = Math.min(scrollPercent * 1, 1);
    // was: revealImage.style.bottom = `${-100 + (revealPercent * 100)}%`;
    // revealImage.style.transform = `translateY(${100 - (revealPercent * 100)}%)`;
    revealImage.style.clipPath = `inset(${100 - (revealPercent * 100)}% 0 0 0)`;


    // Show content at 50% scroll (after reveal completes)
    if (scrollPercent >= 0.45) {
      wowTitle.classList.add('visible');
      wowPromptContainer.classList.add('visible');
    } else {
      wowTitle.classList.remove('visible');
      wowPromptContainer.classList.remove('visible');
    }

    // Change overlay opacity based on scroll
    // const overlayOpacity = Math.max(0.3 - (scrollPercent * 0.5), 0);
    // overlay.style.background = `rgba(0, 0, 0, 0)`;//${overlayOpacity}
  }

  // Drop overlay to zero after 3 seconds from page load
  setTimeout(() => {
    overlay.style.transition = 'background 8s ease-out';
    overlay.style.background = 'rgba(0, 0, 0, 0)';
  }, 1000);

  function checkPassword() {
    const answer = passwordInput.value.toLowerCase().trim();
    
    if (answer === 'the earth') {
      isUnlocked = true;
      
      // Smooth scroll to reveal the full image - scroll to 100% of container over 5 seconds
      const containerHeight = container.clientHeight;
      const scrollTo = containerHeight;
      const startY = window.scrollY;
      const distance = scrollTo - startY;
      const duration = 4000; // 4 seconds
      const startTime = Date.now();
      
      function animateScroll() {
        const elapsed = Date.now() - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        // Easing function for smooth acceleration
        const easeProgress = progress < 0.5 
          ? 2 * progress * progress 
          : -1 + (4 - 2 * progress) * progress;

      
        setTimeout(() => {
          window.scrollTo(0, startY + distance * easeProgress);
        }, 1000); // ~60fps

        if (progress < 1) {
          requestAnimationFrame(animateScroll);
        }
      }
      
      animateScroll();
      
      // Add revealed class after a brief delay
      setTimeout(() => {
        wowWrapper.classList.add('wow-revealed');
      }, 100);
      
      message.textContent = 'Wrong password...';
      message.classList.add('success');
      passwordInput.classList.add('success');
      passwordInput.disabled = true;
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.style.opacity = '0.5';
      }
      // passwordInput.style.opacity = '0.5';
    } else {
      message.textContent = 'Wrong password...';
      message.classList.remove('success');
      passwordInput.classList.remove('success');
      passwordInput.value = '';
      passwordInput.focus();
    }
  }

  if (submitBtn) {
    submitBtn.addEventListener('click', checkPassword);
  }
  
  passwordInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      checkPassword();
    }
  });

  window.addEventListener('scroll', handleScroll);

  // Focus input when it becomes visible
  const observer = new MutationObserver(() => {
    if (wowPromptContainer.classList.contains('visible') && !isUnlocked) {
      // Force focus to trigger mobile keyboard
      passwordInput.focus();
      passwordInput.click();
      
      // On mobile, ensure keyboard opens by scrolling input into view
      if (window.innerWidth <= 768) {
        setTimeout(() => {
          passwordInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 150);
      }
    }
  });

  observer.observe(wowPromptContainer, { attributes: true, attributeFilter: ['class'] });
</script>

</body>
</html>
